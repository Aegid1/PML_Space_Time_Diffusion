[project]
name = "pml-space-time-diffusion"
version = "0.1.0"
description = "Implementation for Project Machine Learning."
requires-python = "==3.11.*"
dependencies = [
    "torch>=2.4.1,<3",
    "numpy>=1.26.4,<2",
    "matplotlib==3.9.4",
    "tqdm>=4.67.0,<5",
    "h5py==3.12.1",
    "scipy==1.15.3",
    "jupyterlab>=4.3.0,<5",
    "ipykernel==6.29.5",
    "nbclient==0.10.2",
    "nbformat==5.10.4",
]

[project.optional-dependencies]
aldp = [
    "bgmol @ git+https://github.com/noegroup/bgmol.git@2be2ede75ce137258fc83c01b28648a8c29161de",
    "bgflow @ git+https://github.com/noegroup/bgflow.git@fbba56fac3eb88f6825d2bd4f745ee75ae9715e1",
    "mdtraj==1.9.9",
    "openmm>=8.2.0,<9",
    "PyYAML==6.0.2",
    "requests==2.32.3",
    "setuptools==80.10.2",
    "networkx==3.6.1",
    "einops>=0.8.0,<0.9",
]

[tool.uv]
package = false

# MDTraj 1.9.9 supplies mdtraj.utils.six, which the pinned bgmol requires.
# Its legacy TNG callbacks trigger a default error in current Apple Clang.
# Suppress that legacy callback warning while leaving other diagnostics enabled.
[tool.uv.extra-build-variables]
mdtraj = { CFLAGS = "-Wno-incompatible-function-pointer-types" }
